<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Socialite{% endblock %}</title>
  </head>
  <body>
    <header>
      <a href="{{ url_for('index') }}"><strong>Socialite</strong></a>
      <nav>
        <a href="{{ url_for('grupos') }}">Grupos</a>
        <a href="{{ url_for('companeros') }}">Companeros</a>
        <a href="{{ url_for('registro') }}">Registrarme</a>
      </nav>
    </header>
    <main>
      {% with mensajes = get_flashed_messages() %}
        {% if mensajes %}
        <ul class="mensajes">
          {% for mensaje in mensajes %}
          <li>{{ mensaje }}</li>
          {% endfor %}
        </ul>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
